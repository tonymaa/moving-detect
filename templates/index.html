<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动监控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
.header { background: #16213e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0f3460; }
.header h1 { font-size: 20px; font-weight: 600; }
.status-badge { padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; }
.status-on { background: #00c853; color: #000; }
.status-off { background: #ff5252; color: #fff; }

.container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

.card { background: #16213e; border-radius: 12px; padding: 16px; border: 1px solid #0f3460; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #53a8b6; }

/* Live stream */
.stream-wrap { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
.stream-wrap img { width: 100%; height: auto; display: block; }

/* Controls */
.controls { display: flex; flex-direction: column; gap: 10px; }
.btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
.btn:hover { opacity: 0.85; }
.btn-primary { background: #0f3460; color: #fff; }
.btn-success { background: #00c853; color: #000; }
.btn-danger { background: #ff5252; color: #fff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
select { padding: 8px 12px; border-radius: 8px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 14px; }

/* Notifications */
.notif-list { max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.notif-item { padding: 10px 12px; background: #1a1a2e; border-radius: 8px; border-left: 3px solid #ff5252; font-size: 13px; }
.notif-item .time { color: #888; font-size: 12px; }
.notif-item .msg { margin-top: 4px; }

/* Video list */
.video-list { max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.video-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #1a1a2e; border-radius: 8px; cursor: pointer; transition: background .15s; }
.video-item:hover { background: #0f3460; }
.video-item .thumb { width: 80px; height: 45px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #000; }
.video-item .no-thumb { width: 80px; height: 45px; background: #0f3460; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #555; }
.video-item .info { flex: 1; min-width: 0; }
.video-item .name { font-size: 13px; }
.video-item .meta { font-size: 12px; color: #888; }
.video-item .level { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.level-stranger { background: #ff5252; color: #fff; }
.level-known { background: #00c853; color: #000; }
.level-motion { background: #555; color: #ccc; }
.video-player { width: 100%; border-radius: 8px; margin-top: 10px; background: #000; }
.video-faces { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.video-face { display: flex; align-items: center; gap: 4px; background: #0f3460; border-radius: 8px; padding: 4px 8px; font-size: 12px; }
.video-face img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

/* Face management */
.face-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; max-height: 300px; overflow-y: auto; }
.face-card { background: #1a1a2e; border-radius: 8px; padding: 10px; text-align: center; position: relative; }
.face-card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; }
.face-card .face-name { font-size: 13px; color: #eee; }
.face-card .face-name-input { width: 100%; background: #0f3460; border: 1px solid #53a8b6; border-radius: 4px; color: #eee; padding: 2px 4px; font-size: 12px; text-align: center; }
.face-card .face-count { font-size: 11px; color: #888; margin-top: 2px; }
.face-card .face-delete { position: absolute; top: 4px; right: 4px; background: none; border: none; color: #ff5252; cursor: pointer; font-size: 14px; }
.face-filters { display: flex; gap: 8px; margin-bottom: 10px; }
.face-filter { padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid #0f3460; background: transparent; color: #888; }
.face-filter.active { background: #0f3460; color: #eee; }

.empty-msg { text-align: center; color: #555; padding: 30px; font-size: 14px; }
.full-width { grid-column: 1 / -1; }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#16213e; border-radius:12px; border:1px solid #0f3460; width:480px; max-width:90vw; max-height:80vh; display:flex; flex-direction:column; }
.modal-header { display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid #0f3460; }
.modal-header h2 { font-size:15px; color:#53a8b6; }
.modal-close { background:none; border:none; color:#888; font-size:20px; cursor:pointer; }
.modal-close:hover { color:#eee; }
.modal-body { padding:16px; overflow-y:auto; flex:1; }
.modal-body .video-item { margin-bottom:6px; }
</style>
</head>
<body>

<div class="header">
    <h1>移动监控</h1>
    <div style="display:flex;align-items:center;gap:12px;">
        <span id="statusBadge" class="status-badge status-off">检测关闭</span>
        <button id="logoutBtn" class="btn btn-danger" style="padding:4px 12px;font-size:12px;display:none;" onclick="doLogout()">退出登录</button>
    </div>
</div>

<div class="container">
    <!-- Live Stream -->
    <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">实时画面
            <button id="closeStreamBtn" class="btn btn-danger" style="padding:2px 10px;font-size:12px;display:none;" onclick="closeStream(event)">关闭画面</button>
        </div>
        <div class="stream-wrap" id="streamWrap" style="position:relative;cursor:pointer;min-height:270px;" onclick="revealStream()">
            <img id="liveStream" src="" alt="live" style="display:none;">
            <div id="streamCover" style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:flex;align-items:center;justify-content:center;color:#888;font-size:16px;">
                点击查看实时画面
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="card">
        <div class="card-title">控制面板</div>
        <div class="controls">
            <div>
                <label style="font-size:13px;color:#888;margin-bottom:4px;display:block;">摄像头选择</label>
                <select id="cameraSelect" style="width:100%;">
                    <option value="0">Camera 0</option>
                </select>
            </div>
            <button id="toggleBtn" class="btn btn-primary" onclick="toggleDetect()">开启检测</button>
            <div id="lockButtons">
                <button class="btn btn-primary" onclick="triggerLock()">开启屏保并检测</button>
                <button class="btn btn-primary" onclick="triggerDarkMode()">开启暗屏并检测</button>
            </div>
            <button id="exitLockBtn" class="btn btn-danger" style="display:none;" onclick="triggerExitLock()">退出屏保</button>
            <div style="display:flex;align-items:center;gap:8px;">
                <label style="font-size:13px;color:#888;white-space:nowrap;">录制时长(秒)</label>
                <input id="durationInput" type="number" min="5" max="300" value="15" style="width:60px;padding:6px 8px;border-radius:8px;border:1px solid #0f3460;background:#1a1a2e;color:#eee;font-size:14px;">
                <button class="btn btn-primary" style="padding:6px 12px;font-size:13px;" onclick="saveDuration()">保存</button>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <label style="font-size:13px;color:#888;white-space:nowrap;">显示人脸框</label>
                <button id="faceBoxBtn" class="btn btn-primary" style="padding:6px 12px;font-size:13px;" onclick="toggleFaceBoxes()">关闭</button>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <label style="font-size:13px;color:#888;white-space:nowrap;">录制触发</label>
                <select id="recordModeSelect" style="padding:6px 8px;border-radius:8px;border:1px solid #0f3460;background:#1a1a2e;color:#eee;font-size:13px;" onchange="saveRecordMode()">
                    <option value="motion">任何移动</option>
                    <option value="face">有人脸</option>
                    <option value="new_face">有新人脸</option>
                </select>
            </div>
            <div style="font-size:13px;color:#888;margin-top:4px;">
                当前状态：<span id="detectStatus">未知</span>
                <span id="modeStatus" style="margin-left:8px;"></span>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div class="card">
        <div class="card-title">检测通知 <span id="notifCount" style="font-size:12px;color:#888;"></span></div>
        <div id="notifList" class="notif-list">
            <div class="empty-msg">等待检测事件...</div>
        </div>
    </div>

    <!-- Video History -->
    <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">历史视频
            <button class="btn btn-primary" style="padding:4px 10px;font-size:12px;" onclick="doCleanup()">清理无效记录</button>
        </div>
        <div id="videoList" class="video-list">
            <div class="empty-msg">加载中...</div>
        </div>
        <div id="videoPlayerSection" style="display:none;margin-top:12px;border-top:1px solid #0f3460;padding-top:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span id="playingName" style="font-size:13px;color:#888;"></span>
                <button class="btn btn-danger" style="padding:2px 10px;font-size:12px;" onclick="closePlayer()">关闭</button>
            </div>
            <img id="videoPlayer" class="video-player" style="width:100%;border-radius:8px;background:#000;" alt="video">
            <div id="playingFaces" class="video-faces"></div>
        </div>
    </div>

    <!-- Face Management -->
    <div class="card full-width">
        <div class="card-title">人脸管理</div>
        <div class="face-filters">
            <button class="face-filter active" onclick="filterFaces('all', this)">全部</button>
            <button class="face-filter" onclick="filterFaces('unnamed', this)">未命名</button>
            <button class="face-filter" onclick="filterFaces('named', this)">已命名</button>
        </div>
        <div id="faceGrid" class="face-grid">
            <div class="empty-msg">暂无人脸数据</div>
        </div>
    </div>
</div>

<!-- Person Videos Modal -->
<div class="modal-overlay" id="personModal" onclick="if(event.target===this)closePersonModal()">
    <div class="modal">
        <div class="modal-header">
            <h2 id="personModalTitle">出现视频</h2>
            <button class="modal-close" onclick="closePersonModal()">&times;</button>
        </div>
        <div class="modal-body" id="personModalBody">
            <div class="empty-msg">加载中...</div>
        </div>
    </div>
</div>

<script>
const statusBadge = document.getElementById('statusBadge');
const toggleBtn = document.getElementById('toggleBtn');
const detectStatus = document.getElementById('detectStatus');
const notifList = document.getElementById('notifList');
const notifCount = document.getElementById('notifCount');
const videoList = document.getElementById('videoList');
const videoPlayer = document.getElementById('videoPlayer');
const playingName = document.getElementById('playingName');
const playingFaces = document.getElementById('playingFaces');
const cameraSelect = document.getElementById('cameraSelect');

let detecting = false;
let currentMode = null;
let notifications = [];
let allPersons = [];
let currentFaceFilter = 'all';
let videosCache = [];

const lockButtons = document.getElementById('lockButtons');
const durationInput = document.getElementById('durationInput');
const exitLockBtn = document.getElementById('exitLockBtn');
const modeStatus = document.getElementById('modeStatus');
const faceBoxBtn = document.getElementById('faceBoxBtn');
const logoutBtn = document.getElementById('logoutBtn');

let showFaceBoxes = false;

function updateModeUI() {
    if (currentMode === 'ScreenSaver') {
        lockButtons.style.display = 'none';
        exitLockBtn.style.display = 'block';
        exitLockBtn.textContent = '退出屏保';
        modeStatus.textContent = '| 屏保模式';
        modeStatus.style.color = '#ff5252';
    } else if (currentMode === 'DarkScreen') {
        lockButtons.style.display = 'none';
        exitLockBtn.style.display = 'block';
        exitLockBtn.textContent = '退出暗屏';
        modeStatus.textContent = '| 暗屏模式';
        modeStatus.style.color = '#ff5252';
    } else {
        lockButtons.style.display = 'block';
        exitLockBtn.style.display = 'none';
        modeStatus.textContent = '';
    }
}

// Load initial status
fetch('/api/status').then(r => r.json()).then(d => {
    detecting = d.detecting;
    currentMode = d.mode || null;
    showFaceBoxes = d.show_face_boxes || false;
    if (d.recording_duration) durationInput.value = d.recording_duration;
    if (d.record_mode) document.getElementById('recordModeSelect').value = d.record_mode;
    updateUI();
    updateModeUI();
    updateFaceBoxUI();
});

function saveDuration() {
    const val = parseInt(durationInput.value) || 15;
    durationInput.value = val;
    fetch('/api/set_recording_duration', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({duration: val})
    }).then(r => r.json()).then(d => { durationInput.value = d.recording_duration; });
}

function toggleFaceBoxes() {
    showFaceBoxes = !showFaceBoxes;
    fetch('/api/set_show_face_boxes', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: showFaceBoxes})
    }).then(r => r.json()).then(d => { showFaceBoxes = d.show_face_boxes; updateFaceBoxUI(); });
}

function updateFaceBoxUI() {
    faceBoxBtn.textContent = showFaceBoxes ? '开启' : '关闭';
    faceBoxBtn.className = 'btn ' + (showFaceBoxes ? 'btn-success' : 'btn-primary');
}

function doLogout() {
    fetch('/api/logout', { method: 'POST' }).then(() => { window.location.href = '/login'; });
}

fetch('/api/auth_status').then(r => r.json()).then(d => {
    if (d.auth_enabled) logoutBtn.style.display = 'inline-block';
});

// Load cameras
fetch('/api/cameras').then(r => r.json()).then(cameras => {
    cameraSelect.innerHTML = '';
    cameras.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.index;
        opt.textContent = c.name;
        cameraSelect.appendChild(opt);
    });
    fetch('/api/status').then(r => r.json()).then(d => {
        if (d.camera_index !== undefined) cameraSelect.value = d.camera_index;
    });
});

// Load videos
function loadVideos() {
    fetch('/api/videos').then(r => r.json()).then(files => {
        videosCache = files;
        if (!files.length) {
            videoList.innerHTML = '<div class="empty-msg">暂无录制视频</div>';
            return;
        }
        videoList.innerHTML = '';
        files.forEach(f => {
            const item = document.createElement('div');
            item.className = 'video-item';
            const thumbHtml = f.thumb
                ? `<img class="thumb" src="/api/thumb/${f.filename.replace(/\.\w+$/, '.jpg')}" alt="thumb">`
                : `<div class="no-thumb">无图</div>`;
            const facesHtml = f.faces.length
                ? f.faces.map(p => `<img src="${p.photo_url}" title="${p.name || '未命名'}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">`).join('')
                : '';
            const levelClass = `level-${f.level_type}`;
            item.innerHTML = `${thumbHtml}<div class="info"><div class="name">${f.display}</div><div style="display:flex;gap:4px;margin-top:4px;align-items:center;">${facesHtml}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;"><span class="level ${levelClass}">${f.level}</span><span class="meta">${f.size_mb} MB</span></div>`;
            item.onclick = () => playVideo(f);
            videoList.appendChild(item);
        });
    });
}
loadVideos();
setInterval(loadVideos, 30000);

function playVideo(v) {
    videoPlayer.src = '/api/play/' + v.filename;
    playingName.textContent = v.display;
    document.getElementById('videoPlayerSection').style.display = 'block';
    if (v.faces.length) {
        playingFaces.style.display = 'flex';
        playingFaces.innerHTML = v.faces.map(p =>
            `<div class="video-face"><img src="${p.photo_url}"><span>${p.name || '未命名'}</span></div>`
        ).join('');
    } else {
        playingFaces.style.display = 'none';
        playingFaces.innerHTML = '';
    }
}

function closePlayer() {
    videoPlayer.src = '';
    document.getElementById('videoPlayerSection').style.display = 'none';
}

function updateUI() {
    statusBadge.textContent = detecting ? '检测中' : '检测关闭';
    statusBadge.className = 'status-badge ' + (detecting ? 'status-on' : 'status-off');
    toggleBtn.textContent = detecting ? '关闭检测' : '开启检测';
    toggleBtn.className = 'btn ' + (detecting ? 'btn-danger' : 'btn-success');
    detectStatus.textContent = detecting ? '运行中' : '已停止';
}

function revealStream() {
    var img = document.getElementById('liveStream');
    var cover = document.getElementById('streamCover');
    img.src = '/api/stream';
    img.style.display = 'block';
    cover.style.display = 'none';
    document.getElementById('closeStreamBtn').style.display = 'inline-block';
}

function closeStream(e) {
    e.stopPropagation();
    var img = document.getElementById('liveStream');
    var cover = document.getElementById('streamCover');
    img.src = '';
    img.style.display = 'none';
    cover.style.display = 'flex';
    document.getElementById('closeStreamBtn').style.display = 'none';
}

function toggleDetect() {
    fetch('/api/toggle_detect', { method: 'POST' })
        .then(r => r.json())
        .then(d => { detecting = d.detecting; updateUI(); });
}

function triggerLock() {
    fetch('/api/lock', { method: 'POST' })
        .then(r => r.json())
        .then(d => { if (d.status !== 'ok') alert(d.message || '操作失败'); });
}

function triggerDarkMode() {
    fetch('/api/dark_mode', { method: 'POST' })
        .then(r => r.json())
        .then(d => { if (d.status !== 'ok') alert(d.message || '操作失败'); });
}

function triggerExitLock() {
    fetch('/api/exit_lock', { method: 'POST' })
        .then(r => r.json())
        .then(d => { if (d.status !== 'ok') alert(d.message || '操作失败'); });
}

// Face management
function loadPersons() {
    fetch('/api/persons').then(r => r.json()).then(persons => {
        allPersons = persons;
        renderFaces();
    });
}
loadPersons();

function filterFaces(filter, btn) {
    currentFaceFilter = filter;
    document.querySelectorAll('.face-filter').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderFaces();
}

function renderFaces() {
    const grid = document.getElementById('faceGrid');
    let filtered = allPersons;
    if (currentFaceFilter === 'unnamed') filtered = allPersons.filter(p => !p.name);
    else if (currentFaceFilter === 'named') filtered = allPersons.filter(p => p.name);

    if (!filtered.length) {
        grid.innerHTML = '<div class="empty-msg">暂无人脸数据</div>';
        return;
    }
    grid.innerHTML = '';
    filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'face-card';
        card.style.cursor = 'pointer';
        card.onclick = function(e) { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') showPersonVideos(p.id, p.name); };
        card.innerHTML = `
            <button class="face-delete" onclick="event.stopPropagation();deletePerson(${p.id})" title="删除">&times;</button>
            <img src="/api/persons/${p.id}/photo" alt="face">
            <div class="face-name">${p.name || '<span style="color:#888">未命名</span>'}</div>
            <input class="face-name-input" placeholder="输入名字" value="${p.name || ''}" onclick="event.stopPropagation()" onchange="renamePerson(${p.id}, this.value)">
            <div class="face-count">出现 ${p.video_count || 0} 次</div>
        `;
        grid.appendChild(card);
    });
}

function renamePerson(id, name) {
    fetch(`/api/persons/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: name})
    }).then(() => { loadPersons(); loadVideos(); });
}

function showPersonVideos(id, name) {
    var modal = document.getElementById('personModal');
    document.getElementById('personModalTitle').textContent = (name || '未命名') + ' - 出现视频';
    document.getElementById('personModalBody').innerHTML = '<div class="empty-msg">加载中...</div>';
    modal.classList.add('show');
    fetch('/api/persons/' + id + '/videos').then(r => r.json()).then(videos => {
        var body = document.getElementById('personModalBody');
        if (!videos.length) {
            body.innerHTML = '<div class="empty-msg">暂无关联视频</div>';
            return;
        }
        body.innerHTML = '';
        videos.forEach(v => {
            var item = document.createElement('div');
            item.className = 'video-item';
            var thumbHtml = v.thumb
                ? '<img class="thumb" src="/api/thumb/' + v.filename.replace(/\.\w+$/, '.jpg') + '" alt="thumb">'
                : '<div class="no-thumb">无图</div>';
            item.innerHTML = thumbHtml + '<div class="info"><div class="name">' + v.display + '</div></div>';
            item.onclick = function() { closePersonModal(); playVideo(v); };
            body.appendChild(item);
        });
    });
}

function closePersonModal() {
    document.getElementById('personModal').classList.remove('show');
}

function doCleanup() {
    fetch('/api/cleanup', { method: 'POST' })
        .then(r => r.json())
        .then(d => { alert('清理完成：删除 ' + d.removed_videos + ' 条视频记录，' + d.removed_persons + ' 个孤立人脸'); loadVideos(); loadPersons(); });
}

function saveRecordMode() {
    var mode = document.getElementById('recordModeSelect').value;
    fetch('/api/set_record_mode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mode: mode})
    });
}

function deletePerson(id) {
    if (!confirm('确定删除此人脸？')) return;
    fetch(`/api/persons/${id}`, { method: 'DELETE' })
        .then(() => { loadPersons(); loadVideos(); });
}

// SSE notifications
const evtSource = new EventSource('/api/notifications');
evtSource.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (data.type === 'mode') {
        currentMode = data.mode;
        updateModeUI();
        return;
    }
    notifications.unshift(data);
    if (notifications.length > 100) notifications.pop();
    renderNotifications();
    loadVideos();
    loadPersons();
};

function renderNotifications() {
    notifCount.textContent = `(${notifications.length})`;
    if (!notifications.length) {
        notifList.innerHTML = '<div class="empty-msg">等待检测事件...</div>';
        return;
    }
    notifList.innerHTML = '';
    notifications.forEach(n => {
        const item = document.createElement('div');
        item.className = 'notif-item';
        item.innerHTML = `<div class="time">${n.time}</div><div class="msg">检测到移动，变化率 ${n.change}%</div>`;
        notifList.appendChild(item);
    });
}
</script>
</body>
</html>
